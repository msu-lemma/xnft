[project]
name = "xnft"
dynamic = ["version"]
authors = [
  { name = "Jason Merlo", email = "merlojas@msu.edu" },
  { name = "Mauro Ettorre", email = "ettorre@msu.edu" },
  { name = "LEmmA Group, Michigan State University" },
]
maintainers = [{ name = "Jason Merlo", email = "merlojas@msu.edu" }]
readme = "README.md"
description = "Antenna measurement and analysis software."
license = "MIT"

requires-python = ">=3.10,<3.16"

dependencies = [
  "scipy>=1.18.1,<2",
  "numpy>=2.3.5,<3",
  "numba>=0.63.1,<0.64",
  "xarray>=2026.7.0,<2027",
  "finufft>=2.5.1,<3",
  "pyside6>=6.11.2,<7",
  "pyqtgraph>=0.14.0,<0.15",
  "colorcet>=3.2.1,<4",
  "pyyaml>=6.0.3,<7",
  "netcdf4>=1.7.4,<2",
  "h5py>=3.16.0,<4",
  "pandas>=3.0.6,<4",
  "quantiphy>=2.23,<3",
  "unyt>=3.1.0,<4",
]

[project.scripts]
xnft = "xnft.gui.app:main"

[project.urls]
Homepage = "https://gitlab.msu.edu/ece-lemma/near-field"
Issues = "https://gitlab.msu.edu/ece-lemma/near-field/-/issues"

