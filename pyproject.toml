[project]
name = "xnft"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
description = "Near-field to far-field antenna measurement transformation software."
version = "0.1.0"

[project.scripts]
xnft = "xnft:main"

# === Pixi Configurations ===

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

[tool.pixi.package]
name = "xnft"
authors = ["LEmmA Group, Michigan State University"]

# [tool.pixi.package.host-dependencies] 
# hatchling = "==1.26.3"

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.package.build.config]
noarch = false
compilers = ["cxx"]  # Required to build rocket-fft from source (for python 3.13 support)

[tool.pixi.environments]
test = ["test"]
docs = ["docs"]

[tool.pixi.tasks]

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.docs.tasks]
build-html-docs = { cmd = [
    "echo", "'Building HTML docs...'",
    "&&", "sphinx-build", "-M", "html", "docs/source", "docs/build"
] }
build-pdf-docs = { cmd = [ 
    "echo", "'Building LaTeX PDF docs...'",
    "&&", "sphinx-build", "-M", "latexpdf", "docs/source", "docs/build"
] }
build-docs = { depends-on = [
    "build-html-docs", 
    "build-pdf-docs"
] }

[tool.pixi.dependencies]
ipympl = ">=0.9.7,<0.10"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.6,<4"
scipy = ">=1.16.2,<2"
seaborn = ">=0.13.2,<0.14"
pandas = ">=2.3.3,<3"
numpy = ">=2.3.3,<3"
numba = ">=0.62.1,<0.63"
pip = ">=25.2,<26"
clang = "*"
xarray = ">=2025.10.1,<2026"
uv = ">=0.9.7,<0.10"

[tool.pixi.pypi-dependencies]
xnft = { path = ".", editable = true }
rocket-fft = { git = "https://github.com/styfenschaer/rocket-fft.git", rev = "b707c76bed5de65355c5e3bb0d5fbf167cae93c7" }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.3,<9"
pydata-sphinx-theme = "*"
