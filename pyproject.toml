[project]
name = "xnft"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
xnft = "xnft:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.version]
path = "src/hatch_demo/__about__.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.pypi-dependencies]
xnft = { path = ".", editable = true }

[tool.pixi.tasks]
