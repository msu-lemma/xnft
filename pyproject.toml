[project]
name = "xnft"
dynamic = ["version"]
authors = [
  { name = "LEmmA Group, Michigan State University" },
  { name = "Jason Merlo", email = "merlojas@msu.edu" },
  { name = "Mauro Ettorre", email = "ettorre@msu.edu" },
]
maintainers = [{ name = "Jason Merlo", email = "merlojas@msu.edu" }]
readme = "README.md"
description = "Near-field to far-field antenna measurement transformation software."

requires-python = ">=3.13,<3.15"

[project.scripts]
xnft = "xnft.gui.main:run_gui"

[project.urls]
Homepage = "https://gitlab.msu.edu/ece-lemma/near-field"
Issues = "https://gitlab.msu.edu/ece-lemma/near-field/-/issues"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# === PyTest Configuration ===

[tool.pytest.ini_options]
addopts = "--cov='xnft' --cov-report term --cov-report xml:coverage.xml --junitxml report.xml -n auto"

[tool.coverage.run]
source = ["src"]
omit = ["**/.pixi/**", "**/tests/**"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
