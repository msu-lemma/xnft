[project]
name = "xnft"
dynamic = ["version"]
authors = [
    { name = "LEmmA Group, Michigan State University" },
    { name = "Jason Merlo", email = "merlojas@msu.edu" },
    { name = "Mauro Ettorre", email = "ettorre@msu.edu" },
]
maintainers = [{ name = "Jason Merlo", email = "merlojas@msu.edu" }]
readme = "README.md"
description = "Near-field to far-field antenna measurement transformation software."

[project.scripts]
xnft = "xnft.gui.main:main"

[project.urls]
Homepage = "https://gitlab.msu.edu/ece-lemma/near-field"
Issues = "https://gitlab.msu.edu/ece-lemma/near-field/-/issues"

# === PyTest Configuration ===

[tool.pytest.ini_options]
addopts = "--cov=xnft --cov-report term --cov-report xml:coverage.xml -n auto"
