[project]
name = "xnft"
dynamic = ["version"]
authors = [
  { name = "Jason Merlo", email = "merlojas@msu.edu" },
  { name = "Mauro Ettorre", email = "ettorre@msu.edu" },
]
maintainers = [{ name = "Jason Merlo", email = "merlojas@msu.edu" }]
readme = "README.md"
description = "Antenna measurement and analysis software."
license = "MIT"

keywords = [
  "antenna",
  "antenna measurements",
  "near-field measurement",
  "near-field transform",
  "probe compensation",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
  "scipy>=1.18.1,<2",
  "numpy>=2.5.4,<3",
  "numba>=0.68.0,<0.69",
  "xarray>=2026.9.0,<2027",
  "finufft>=2.5.1,<3",
  "pyside6>=6.11.2,<7",
  "pyqtgraph>=0.14.0,<0.15",
  "colorcet>=3.2.1,<4",
  "pyyaml>=6.0.3,<7",
  "netcdf4>=1.7.4,<2",
  "h5py>=3.16.0,<4",
  "pandas>=3.0.6,<4",
  "dill >=0.4.1,<0.5",
  "quantiphy>=2.23,<3",
  "unyt>=3.1.0,<4",
]

[project.gui-scripts]
xnft = "xnft.gui.app:main"

[project.urls]
homepage = "https://gitlab.msu.edu/ece-lemma/near-field"
repository = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft.git"
github = "https://github.com/msu-lemma/xnft"
issues = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft/-/work_items?sort=closed_at_desc&state=opened"
download = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft/-/releases"
changelog = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft/-/blob/main/CHANGELOG.md"
documentation = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft/-/tree/main/docs"

[build-system]
requires = ["hatchling>=1.32.4,<2", "hatch-vcs>=0.5.0,<0.6"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/xnft"]

[tool.hatch.build.targets.sdist]
include = ["/src/xnft", "/pyproject.toml", "/README.md", "/LICENSE"]
exclude = ["/tests", "/data", "/docs", "/.pixi", "/.pixi-cache"]

# === PyTest Configuration ===

[tool.pytest.ini_options]
addopts = "--cov='xnft' --cov-report term --cov-report xml:coverage.xml --junitxml report.xml -n auto"

[tool.coverage.run]
source = ["src"]
omit = ["**/.pixi/**", "**/tests/**"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

# === Ruff Configuration ===

[tool.ruff]
# Exclude CI pixi cache folder.
extend-exclude = [".pixi-cache"]

[tool.ruff.lint]
# select = ["E", "F", "I"]
# select = ["ALL"]
preview = true
select = ["correctness", "suspicious", "complexity", "performance", "style"]
# select = [
#   "E",   # pycodestyle
#   "F",   # Pyflakes
#   "UP",  # pyupgrade
#   "B",   # flake8-bugbear
#   "SIM", # flake8-simplify
#   "I",   # isort
# ]
ignore = [
  "D212",   # Prefer multi-line summary starting on the second line
  "COM812", # Ruff formatter already enforces this rule
  "DTZ",    # Not acceptable if attempting to use local timezones
]
