stages:
  - pixi-cache
  - build-test
  - package
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

default:
  interruptible: true

variables:
  DEBIAN_FRONTEND: "noninteractive"
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi-cache"
  QT_QPA_PLATFORM: "offscreen" # Allow rendering on headless platforms
  # FF_USE_FASTZIP: "true"
  # CACHE_COMPRESSION_LEVEL: "fastest"

# Store our package cache in our git repo so we can cache it
.pixi-cache: &pixi-cache
  key:
    files:
      - pixi.lock
  paths:
    - .pixi-cache/ # installed pixi environments
  policy: pull

prepare-pixi-cache:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: pixi-cache
  cache:
    <<: *pixi-cache
    policy: pull-push
  script:
    - pixi install -e test-py312
    - pixi install -e test-py313
    - pixi install -e test-py314

# Run test cases for all supported python versions
test:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test

  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: "data"
    GIT_SUBMODULE_DEPTH: "1"
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    GIT_LFS_SKIP_SMUDGE: "1"

  parallel:
    matrix:
      - PIXI_ENVIRONMENT:
          - test-py312
          - test-py313
          - test-py314

  cache:
    <<: *pixi-cache

  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git git-lfs
    - git -C data lfs pull

  script:
    - pixi run -e "$PIXI_ENVIRONMENT" python --version
    - pixi run -e "$PIXI_ENVIRONMENT" pytest -s -n 8

  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Run code quality test
code-quality:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test
  cache:
    <<: *pixi-cache
  script:
    - pixi run -e test ruff check --output-format=gitlab --output-file=$CI_PROJECT_DIR/code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

# Builds the sphinx documentation for the project
docs-build:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test
  cache:
    <<: *pixi-cache
  before_script:
    - >
      apt-get update && apt-get install -y --no-install-recommends
      xindy
      texlive-xetex
      texlive-fonts-recommended
      texlive-fonts-extra
      fonts-freefont-otf
      fontconfig
    - rm -rf /var/lib/apt/lists/*
  script:
    - pixi run -e docs build-docs
    - tar -czf docs/api/build/xnft-docs.tar.gz docs/api/build/html
  artifacts:
    paths:
      - docs/api/build/*.pdf
      - docs/api/build/xnft-docs.tar.gz

# Generate packaged applications
package:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: package

  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"

  cache:
    <<: *pixi-cache

  before_script:
    - git fetch --force --tags
    - git describe --tags --always --dirty

  script:
    - pixi run --frozen -e build build-wheel
    - pixi publish --target-dir=dist

    # Rename conda file for stable artifact url
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        CONDA_FILE="$(find dist -maxdepth 1 -type f -name '*.conda' -print -quit)"
        cp "$CONDA_FILE" dist/xnft-dev-main.conda
      fi

    # Get file names for release stages
    - echo "CONDA_FILE=$(find dist -maxdepth 1 -type f -name '*.conda' ! -name 'xnft-dev-main.conda' -printf '%f\n' -quit)" >> package.env
    - echo "WHEEL_FILE=$(find dist -maxdepth 1 -type f -name '*.whl' -printf '%f\n')" >> package.env
    - echo "SDIST_FILE=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n')" >> package.env

  artifacts:
    expire_in: 30 days
    paths:
      - "dist/*.conda"
      - "dist/*.whl"
      - "dist/*.tar.gz"
    reports:
      dotenv: package.env

# Publish the latest build wheel
publish-wheel: 
  interruptible: false
  stage: release
  image: ghcr.io/prefix-dev/pixi:latest

  variables:
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"

  needs:
    - job: test
    - job: package
      artifacts: true

  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

  script:
    - pixi run -e build python -m twine upload
      --non-interactive
      --repository-url
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      dist/*.whl
      dist/*.tar.gz

# Publish the latest conda package
publish-conda:
  interruptible: false
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"

  needs:
    - job: test
    - job: package
      artifacts: true

  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

  script:
    - CONDA_FILE="$(find dist -maxdepth 1 -type f -name '*.conda' -print -quit)"
    - echo "Uploading $(basename "${CONDA_FILE}")"
    - glab packages upload "${CONDA_FILE}" \
      --name "${CI_PROJECT_NAME}-dev" \
      --version "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"

# Upload packages to registry
package-release:
  interruptible: false
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"

  needs:
    - job: test
    - job: package
      artifacts: true

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'

  script:
    - |
      for PACKAGE_FILE in dist/*.conda dist/*.whl dist/*.tar.gz; do
        if [ ! -f "${PACKAGE_FILE}" ]; then
          continue
        fi

        echo "Uploading $(basename "${PACKAGE_FILE}")"

        glab packages upload "${PACKAGE_FILE}" \
          --name "${CI_PROJECT_NAME}" \
          --version "${CI_COMMIT_TAG}"
      done

# Create release for tagged versions
release:
  interruptible: false
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"

  needs:
    - job: test
    - job: package
      artifacts: true
    - job: package-release

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'

  before_script: []

  script:
    - echo "Creating release for ${CI_COMMIT_TAG}..."

  release:
  interruptible: false
    name: "Release $CI_COMMIT_TAG"
    description: "Release created by pipeline $CI_PIPELINE_URL."
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"

    assets:
      links:
        - name: "$CONDA_FILE"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$CONDA_FILE"
          filepath: "/packages/$CONDA_FILE"
          link_type: "package"

        - name: "$WHEEL_FILE"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$WHEEL_FILE"
          filepath: "/packages/$WHEEL_FILE"
          link_type: "package"

        - name: "$SDIST_FILE"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$SDIST_FILE"
          filepath: "/packages/$SDIST_FILE"
          link_type: "package"
