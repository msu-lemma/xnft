stages:
  - test-and-docs-build
  - release

variables:
  GIT_LFS_SKIP_SMUDGE: "1"
  DEBIAN_FRONTEND: "noninteractive"

# Store our package cache in our git repo so we can cache it
cache:
  paths:
    - .pixi/        # installed pixi environments

# Run test cases
test-job:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: test-and-docs-build
  script:
  - pixi run -e test test
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Run code quality test
code-quality-job:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: test-and-docs-build
  script:
  - pixi run -e test ruff check --output-format=gitlab --output-file=$CI_PROJECT_DIR/code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

# Builds the sphinx documentation for the project
docs-build-job:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: test-and-docs-build
  before_script:
  - > 
    apt-get update && apt-get install -y --no-install-recommends 
    xindy
    texlive-xetex
    texlive-fonts-recommended
    texlive-fonts-extra
    fonts-freefont-otf
    fontconfig
  - rm -rf /var/lib/apt/lists/*
  script:
  - pixi run -e docs build-docs
  artifacts:
    paths:
      - docs/build/

release-job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: 
    - job: test-job
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'
  before_script: []
  script:
    - echo "Createing release..."
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release created using the release-cli.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
