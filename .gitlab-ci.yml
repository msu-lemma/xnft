stages:
  - test
  - docs-build

image: ghcr.io/prefix-dev/pixi:latest

# Store our package cache in our git repo so we can cache it
variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:docs-page-$CI_COMMIT_SHORT_SHA  

cache:
  paths:
    - .pixi/        # installed pixi environments

# Run test cases
test-job:
  stage: test
  script:
  - pixi run -e test test
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      
