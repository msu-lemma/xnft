stages:
  - pixi-cache
  - build-test
  - release

variables:
  # GIT_LFS_SKIP_SMUDGE: "1"
  DEBIAN_FRONTEND: "noninteractive"
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi-cache"
  QT_QPA_PLATFORM: "offscreen" # Allow rendering on headless platforms
  # FF_USE_FASTZIP: "true"
  # CACHE_COMPRESSION_LEVEL: "fastest"

# Store our package cache in our git repo so we can cache it
.pixi-cache: &pixi-cache
  key:
    files:
      - pixi.lock
  paths:
    - .pixi-cache/ # installed pixi environments
  policy: pull

prepare-pixi-cache:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: pixi-cache
  cache:
    <<: *pixi-cache
    policy: pull-push
  script:
    - pixi install -e test
  rules:
    - changes:
        - pixi.lock
        - pixi.toml
        - pyproject.toml

# Run test cases
test:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test
  cache:
    <<: *pixi-cache
  script:
    - pixi run -e test test
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Run code quality test
code-quality:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test
  cache:
    <<: *pixi-cache
  script:
    - pixi run -e test ruff check --output-format=gitlab --output-file=$CI_PROJECT_DIR/code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

# Builds the sphinx documentation for the project
docs-build:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test
  cache:
    <<: *pixi-cache
  before_script:
    - >
      apt-get update && apt-get install -y --no-install-recommends 
      xindy
      texlive-xetex
      texlive-fonts-recommended
      texlive-fonts-extra
      fonts-freefont-otf
      fontconfig
    - rm -rf /var/lib/apt/lists/*
  script:
    - pixi run -e docs build-docs
    - tar -czf docs/build/xnft-docs.tar.gz docs/build/html
  artifacts:
    paths:
      - docs/build/*.pdf
      - docs/build/xnft-docs.tar.gz

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  cache:
    <<: *pixi-cache
  needs:
    - job: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'
  before_script: []
  script:
    - echo "Creating release for $CI_COMMIT_TAG..."
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Release created by pipeline $CI_PIPELINE_URL."
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
