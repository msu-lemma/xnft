[workspace]
preview = ["pixi-build"]
authors = ["Jason Merlo <merlojas@msu.edu>"]
channels = ["conda-forge"]
name = "xnft"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[environments]
test = ["test"]
docs = ["docs"]

[tasks]

[feature.test.tasks]
test = "pytest"

[feature.docs.tasks]
build-html-docs = { cmd = [
    "echo", "'Building HTML docs...'",
    "&&", "sphinx-build", "-M", "html", "docs/source", "docs/build"
] }
build-pdf-docs = { cmd = [ 
    "echo", "'Building LaTeX PDF docs...'",
    "&&", "sphinx-build", "-M", "latexpdf", "docs/source", "docs/build"
] }
build-docs = { depends-on = [
    "build-html-docs", 
    "build-pdf-docs"
] }

[dependencies]
xnft = { path = "." }
ipympl = ">=0.9.7,<0.10"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.6,<4"
scipy = ">=1.16.2,<2"
seaborn = ">=0.13.2,<0.14"
pandas = ">=2.3.3,<3"
numpy = ">=2.3.3,<3"
numba = ">=0.62.1,<0.63"
pip = ">=25.2,<26"
clang = "*"
python = "3.12.*"
xarray = ">=2025.10.1,<2026"

[pypi-dependencies]
rocket-fft = ">=0.2.5, <0.3"

[feature.test.dependencies]
pytest = "*"

[feature.docs.dependencies]
sphinx = ">=8.2.3,<9"
pydata-sphinx-theme = "*"

[package]
name = "xnft"
version = "0.1.0"

[package.build] 
backend = { name = "pixi-build-python", version = "==0.4.0" }

[package.host-dependencies] 
hatchling = "==1.26.3"