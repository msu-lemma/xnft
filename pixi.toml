[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = [
  { platform = "osx-arm64", macos = "15.0" },
  { platform = "osx-64", macos = "15.0" },
  { platform = "linux-64", glibc = "2.35" },
  { platform = "linux-aarch64", glibc = "2.35" },
  { platform = "win-64" },
]
preview = ["pixi-build"]

[package]
name = "xnft"
version = "0.0.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[package.build-dependencies]
git = ">=2.53.0,<3"

[package.host-dependencies]
setuptools = ">=82.0.0,<83"
setuptools_scm = ">=9.2.2,<10"

[package.run-dependencies]
python = ">=3.14.3,<3.15"
scipy = ">=1.17.1,<2"
pandas = ">=3.0.1,<4"
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
clang = ">=21.1.8,<22"
xarray = ">=2026.2.0,<2027"
pyside6 = ">=6.10.2,<7"
pyqtgraph = ">=0.14.0,<0.15"

# File IO
pyyaml = ">=6.0.3,<7"  # Load theoretical aperture files
netcdf4 = ">=1.7.4,<2" # Export xarray to HDF5
h5py = ">=3.15.1,<4"   # Read HDF5 files for LEmmA formatted loader

# Unit handling/formatting
quantiphy = ">=2.21,<3"
unyt = ">=3.1.0,<4"

# TODO: build finufft from source for better performance
#   See notes for feature.cuda support on win-64
finufft = ">=2.4.1,<3"

colorcet = ">=3.1.0,<4"


[package.build.config]
noarch = false
# compilers = [
#     "cxx",
# ]


[activation.env]
# Workaround to enforce editable installation -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
# BUILD_EDITABLE_PYTHON = "true"

[environments]
jupyter = ["dev", "test", "jupyter"]
docs = ["docs"]
build = ["build"]
test = ["test"]
dev = ["test", "docs", "dev"]

[tasks]

[feature.test.tasks]

test = "pytest -s"

[feature.docs.tasks]

build-apidoc = { cmd = ["sphinx-apidoc", "-o", "docs/source/api", "src/xnft"] }

build-html-docs = { cmd = [
  "echo",
  "'Building HTML docs...'",
  "&&",
  "sphinx-build",
  "-M",
  "html",
  "$PIXI_PROJECT_ROOT/docs/source",
  "$PIXI_PROJECT_ROOT/docs/build",
], depends-on = [
  "build-apidoc",
] }

build-pdf-docs = { cmd = [
  "echo",
  "'Building LaTeX PDF docs...'",
  "&&",
  "sphinx-build",
  "-M",
  "latexpdf",
  "$PIXI_PROJECT_ROOT/docs/source",
  "$PIXI_PROJECT_ROOT/docs/build",
  "&&",
  "mv",
  "$PIXI_PROJECT_ROOT/docs/build/latex/*.pdf",
  "$PIXI_PROJECT_ROOT/docs",
], depends-on = [
  "build-apidoc",
] }

build-docs = { depends-on = ["build-html-docs", "build-pdf-docs"] }

[feature.dev.tasks]
format = { cmd = ["black", "$PIXI_PROJECT_ROOT", "--line-length", "79"] }

[feature.build.tasks.gen-icons]
cmd = [
  "bash",
  "-c",
  """
set -e

PNG_PATH="src/xnft/resources/icons/xnft.png"
ICO_PATH="src/xnft/resources/icons/xnft.ico"
ICNS_PATH="src/xnft/resources/icons/xnft.iconset"

# Windows
magick "${PNG_PATH}" -define icon:auto-resize=16,32,48,256 "${ICO_PATH}"

# macOS
mkdir -p "${ICNS_PATH}"

sizes="16:32 32:64 128:256 256:512 512:1024"
for pair in ${sizes}; do
  base=${pair%:*}
  retina=${pair#*:}

  magick "${PNG_PATH}" -resize ${base}x${base} "${ICNS_PATH}/icon_${base}x${base}.png"
  magick "${PNG_PATH}" -resize ${retina}x${retina} "${ICNS_PATH}/icon_${base}x${base}@2x.png"
done

iconutil -c icns "${ICNS_PATH}"
""",
]

[feature.build.tasks.build-exe]
cmd = ["pyinstaller", "--noconfirm", "xnft.spec"]

[feature.build.tasks.build-wheel]
cmd = ["uv", "build"]

[feature.build.tasks.release]
args = [{ arg = "platform", default = "osx-arm64" }]
cmd = [
  "bash",
  "-c",
  """
set -euo pipefail

VERSION="$(git describe --tags --abbrev=0)"
VERSION_PEP440="${VERSION#v}"   # remove leading 'v' from tag

TOKEN="$(security find-generic-password -s gitlab-token -w)"

PROJECT_ID=28094
PACKAGE_NAME=xnft
FILE="xnft-{{ platform }}-${VERSION_PEP440}.zip"
FILE_PATH="dist/${FILE}"
URL="https://gitlab.msu.edu/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${FILE}"

curl --fail --show-error --silent \
  --header "PRIVATE-TOKEN: ${TOKEN}" \
  --upload-file "${FILE_PATH}" \
  "${URL}"

curl --fail --show-error --silent \
  --request POST \
  --header "PRIVATE-TOKEN: ${TOKEN}" \
  --data "name={{ platform }}" \
  --data "url=${URL}" \
  "https://gitlab.msu.edu/api/v4/projects/${PROJECT_ID}/releases/${VERSION}/assets/links"
""",
]

[dependencies]
# Editable installation not yet supported -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
xnft = { path = "." }
git-lfs = ">=3.8.0,<4"

python = ">=3.14.7,<3.15"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.5,<4"
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
clang = ">=21.1.8,<22"
xarray = ">=2026.7.0,<2027"
pyside6 = ">=6.11.2,<7"
pyqtgraph = ">=0.14.0,<0.15"

# File IO
pyyaml = ">=6.0.3,<7"  # Load theoretical aperture files
netcdf4 = ">=1.7.4,<2" # Export xarray to HDF5
h5py = ">=3.16.0,<4"   # Read HDF5 files for LEmmA formatted loader

# Unit handling/formatting
quantiphy = ">=2.22.1,<3"
unyt = ">=3.1.0,<4"

# TODO: build finufft from source for better performance
#   See notes for feature.cuda support on win-64
finufft = ">=2.5.1,<3"

colorcet = ">=3.2.1,<4"
joblib = ">=1.6.0,<2"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
types-pyyaml = ">=6.0.12.20260906,<7"
ruff = ">=0.16.6,<0.17"

[feature.test.target.osx.dependencies]
pytest-memray = ">=1.9.0,<2"

[feature.test.target.linux.dependencies]
pytest-memray = ">=1.9.0,<2"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
pydata-sphinx-theme = ">=0.21.0,<0.22"
numpydoc = ">=1.10.0,<2"
sphinx-copybutton = ">=0.5.2,<0.6"
make = ">=4.4.1,<5"
perl = ">=5.32.1,<5.33"

[feature.docs.target.linux.dependencies]
texlive-core = ">=20260301,<20260302"

[feature.docs.target.osx.dependencies]
texlive-core = ">=20260301,<20260302"

[feature.dev.dependencies]
mypy = ">=2.3.1,<3"
flake8 = ">=7.3.0,<8"
pyflakes = ">=3.4.0,<4"
black = ">=26.5.1,<27"
scipy-stubs = ">=1.18.0.1,<2"
pandas-stubs = ">=3.0.5.260730,<4"
pre-commit = ">=4.6.2,<5"

[feature.dev.target.osx.dependencies]
memray = ">=1.19.3,<2"

[feature.dev.target.linux.dependencies]
memray = ">=1.19.3,<2"

[feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.10.0,<0.11"
tqdm = ">=4.70.0,<5"
numba-progress = ">=1.1.0,<2"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"

[feature.build.dependencies]
pyinstaller = ">=6.22.2,<7"
pillow = ">=12.3.0,<13"
setuptools_scm = ">=10.2.3,<11"
uv = ">=0.12.10,<0.13"
glab = ">=1.117.0,<2"
imagemagick = ">=7.1.2_31,<8"
