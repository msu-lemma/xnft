[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

[system-requirements]
# Minimum system requirements
# ---------------------------
# Note: this doesn't enforce these requirements, it just indicates to the solver
# to find packages that will run on these requirements. The Pixi defaults are
# often conservatively old.
macos = "15.0"
# cuda = "12"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[package.build.config]
noarch = false
compilers = [
    "cxx",
] # Required to build rocket-fft from source (for python 3.13 support)

[environments]
dev = ["test", "dev"]
metal = ["metal"]
dev-metal = ["dev", "metal"]
test = ["test"]
test-metal = ["test", "metal"]
docs = ["docs"]
jupyter = ["dev", "jupyter"]
jupyter-metal = ["dev", "metal", "dev-metal", "jupyter"]

[tasks]

[feature.test.tasks]
test = "pytest -s"

[feature.docs.tasks]
build-html-docs = { cmd = [
    "echo",
    "'Building HTML docs...'",
    "&&",
    "sphinx-build",
    "-M",
    "html",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }
build-pdf-docs = { cmd = [
    "echo",
    "'Building LaTeX PDF docs...'",
    "&&",
    "sphinx-build",
    "-M",
    "latexpdf",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }
build-docs = { depends-on = ["build-html-docs", "build-pdf-docs"] }

[feature.dev.tasks]
format = { cmd = ["black", "$PIXI_PROJECT_ROOT", "--line-length", "79"] }

[dependencies]
ipympl = ">=0.9.8,<0.10"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.8,<4"
scipy = ">=1.16.3,<2"
seaborn = ">=0.13.2,<0.14"
pandas = ">=2.3.3,<3"
numpy = ">=2.3.5,<3"
numba = ">=0.62.1,<0.63"
pip = ">=25.3,<26"
clang = ">=21.1.6,<22"
xarray = ">=2025.11.0,<2026"
uv = ">=0.9.11,<0.10"
click = ">=8.3.1,<9"
pyside6 = ">=6.9.3,<7"
pyqtgraph = ">=0.14.0,<0.15"
pyyaml = ">=6.0.3,<7"
quantiphy = ">=2.20,<3"

[pypi-dependencies]
xnft = { path = ".", editable = true }
rocket-fft = { git = "https://github.com/styfenschaer/rocket-fft.git", rev = "b707c76bed5de65355c5e3bb0d5fbf167cae93c7" }

[feature.metal]
platforms = ["osx-arm64", "linux-64"]

[feature.metal.dependencies]
mlx = ">=0.30.0,<0.31"

[feature.test.dependencies]
pytest = ">=9.0.1,<10"
pytest-cov = ">=7.0.0,<8"
pytest-xdist = ">=3.8.0,<4"
types-pyyaml = ">=6.0.12.20250915,<7"

[feature.docs.dependencies]
sphinx = ">=8.2.3,<9"
pydata-sphinx-theme = ">=0.16.1,<0.17"

[feature.dev.dependencies]
mypy = ">=1.18.2,<2"
flake8 = ">=7.3.0,<8"
pyflakes = ">=3.4.0,<4"
black = ">=25.1.0,<26"

[feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.9.8,<0.10"

[feature.dev-metal]



