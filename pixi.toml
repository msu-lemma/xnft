[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

[system-requirements]
# Minimum system requirements
macos = "15.0"
cuda = "12"
# libc = { family = "glibc", version = "2.39" }  # Minimum required for pyside6-essentials

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[package.build.config]
noarch = false
compilers = [
    # "cxx",
] # Only required to build rocket-fft from source 

[environments]
dev = ["test", "dev"]
metal = ["metal"]
dev-metal = ["dev", "metal"]
test = ["test"]
test-metal = ["test", "metal"]
docs = ["docs"]
jupyter = ["dev", "jupyter"]
jupyter-metal = ["dev", "metal", "dev-metal", "jupyter"]

[tasks]

[feature.test.tasks]
test = "pytest -s"

[feature.docs.tasks]
build-html-docs = { cmd = [
    "echo",
    "'Building HTML docs...'",
    "&&",
    "sphinx-build",
    "-M",
    "html",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }
build-pdf-docs = { cmd = [
    "echo",
    "'Building LaTeX PDF docs...'",
    "&&",
    "sphinx-build",
    "-M",
    "latexpdf",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }
build-docs = { depends-on = ["build-html-docs", "build-pdf-docs"] }

[feature.dev.tasks]
format = { cmd = ["black", "$PIXI_PROJECT_ROOT", "--line-length", "79"] }

[dependencies]
python = ">=3.14.0,<3.15"
ipympl = ">=0.9.8,<0.10"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.8,<4"
scipy = ">=1.16.3,<2"
seaborn = ">=0.13.2,<0.14"
pandas = ">=2.3.3,<3"
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
pip = ">=25.3,<26"
clang = ">=21.1.7,<22"
xarray = ">=2025.12.0,<2026"
uv = ">=0.9.21,<0.10"
click = ">=8.3.1,<9"
pyside6 = ">=6.10.1,<7"
pyqtgraph = ">=0.14.0,<0.15"
pyyaml = ">=6.0.3,<7"
quantiphy = ">=2.21,<3"
git-lfs = ">=3.7.1,<4"

[pypi-dependencies]
xnft = { path = ".", editable = true }
rocket-fft = ">=0.3.1, <0.4"


[feature.metal]
platforms = ["osx-arm64", "linux-64"]

[feature.metal.dependencies]
mlx = ">=0.30.1,<0.31"

[feature.test.dependencies]
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
pytest-xdist = ">=3.8.0,<4"
types-pyyaml = ">=6.0.12.20250915,<7"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
pydata-sphinx-theme = ">=0.16.1,<0.17"

[feature.dev.dependencies]
mypy = ">=1.19.1,<2"
flake8 = ">=7.3.0,<8"
pyflakes = ">=3.4.0,<4"
black = ">=25.12.0,<26"
scipy-stubs = ">=1.16.3.3,<2"
pandas-stubs = ">=2.3.3.251219,<3"

[feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.9.8,<0.10"

[feature.dev-metal]



