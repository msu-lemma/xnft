[feature.test.dependencies]
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
types-pyyaml = ">=6.0.12.20260408,<7"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
pydata-sphinx-theme = ">=0.17.0,<0.18"

[feature.dev.dependencies]
mypy = ">=1.20.1,<2"
flake8 = ">=7.3.0,<8"
pyflakes = ">=3.4.0,<4"
black = ">=26.1.0,<27"
scipy-stubs = ">=1.17.1.4,<2"
pandas-stubs = ">=3.0.0.260204,<4"

[feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.10.0,<0.11"
tqdm = ">=4.67.3,<5"
numba-progress = ">=1.1.0,<2"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"

[feature.build.dependencies]
pyinstaller = "*"
pillow = ">=12.2.0,<13"
setuptools_scm = ">=9.2.2,<10"
uv = ">=0.11.7,<0.12"

[feature.build.target.osx.dependencies]
imagemagick = ">=7.1.2_19,<8"

[feature.build.target.linux.dependencies]
imagemagick = ">=7.1.2_19,<8"


