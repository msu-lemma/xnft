[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[system-requirements]
# Minimum system requirements
macos = "15.0"
# cuda = "13"
libc = { family = "glibc", version = "2.35" } # Describes the minimum linux system specifications


[package]
name = "xnft"
version = "0.0.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[package.host-dependencies]
setuptools = ">=82.0.0,<83"
setuptools_scm = ">=9.2.2,<10"

[package.run-dependencies]
python = ">=3.14.3,<3.15"
scipy = ">=1.17.1,<2"
pandas = ">=3.0.1,<4"
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
clang = ">=21.1.8,<22"
xarray = ">=2026.2.0,<2027"
pyside6 = ">=6.10.2,<7"
pyqtgraph = ">=0.14.0,<0.15"
pyyaml = ">=6.0.3,<7"
quantiphy = ">=2.21,<3"
# TODO: build finufft from source for better performance
#   See notes for feature.cuda support on win-64
finufft = ">=2.4.1,<3"
h5py = ">=3.15.1,<4"
unyt = ">=3.1.0,<4"
colorcet = ">=3.1.0,<4"
netcdf4 = ">=1.7.4,<2"


[package.build.config]
noarch = false
# compilers = [
#     "cxx",
# ]


[activation.env]
# Workaround to enforce editable installation -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
BUILD_EDITABLE_PYTHON = "true"

[environments]

# mlx = ["mlx"]
# cuda = ["cuda"]

dev = ["test", "docs", "dev"]
# dev-mlx = ["test", "dev", "mlx", "dev-mlx"]
# dev-cuda = ["test", "dev", "cuda", "dev-cuda"]

jupyter = ["dev", "test", "jupyter"]
# jupyter-mlx = ["dev", "mlx", "jupyter"]
# jupyter-cuda = ["dev", "cuda", "jupyter"]

test = ["test"]
# test-mlx = ["test", "mlx"]
# test-cuda = ["test", "cuda"]

docs = ["docs"]

build = ["build"]


[tasks]

[feature.test.tasks]

test = "pytest -s"

[feature.docs.tasks]

build-html-docs = { cmd = [
    "echo", "'Building HTML docs...'",
    "&&", "sphinx-build", "-M", "html",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }

build-pdf-docs = { cmd = [
    "echo", "'Building LaTeX PDF docs...'",
    "&&", "sphinx-build", "-M", "latexpdf",
    "$PIXI_PROJECT_ROOT/docs/source",
    "$PIXI_PROJECT_ROOT/docs/build",
] }

build-docs = { depends-on = ["build-html-docs", "build-pdf-docs"] }

[feature.dev.tasks]
format = { cmd = ["black", "$PIXI_PROJECT_ROOT", "--line-length", "79"] }

[feature.build.tasks.gen-icon]
cmd = "magick src/xnft/resources/icons/xnft.png -define icon:auto-resize=16,32,48,256 src/xnft/resources/icons/xnft.ico"

[feature.build.tasks.build-pyinstaller]
cmd = [
    "pyinstaller",
    "--noconfirm",
    "xnft.spec"
]

[feature.build.tasks.build-wheel]
cmd = [
    "uv", "build"
]

[dependencies]
# Editable installation not yet supported -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
xnft = { path = "." }
git-lfs = ">=3.7.1,<4"

[pypi-dependencies]
# xnft = { path = ".", editable = true }
# NOTE: May not be needed if using finufft
# rocket-fft = ">=0.3.1, <0.4"

# [feature.mlx]
# platforms = ["osx-arm64", "linux-64"]

# [feature.mlx.target.osx-arm64.dependencies]
