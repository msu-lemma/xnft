[workspace]
platforms = [
  { platform = "osx-arm64", macos = "15.0" },
  { platform = "osx-64", macos = "15.0" },
  { platform = "linux-64" },                  # glibc = "2.35" },
  { platform = "linux-aarch64" },             # glibc = "2.35" },
  { platform = "win-64" },
]
channels = ["https://prefix.dev/conda-forge"]
preview = ["pixi-build"]
exclude-newer = "14d" # Wait two weeks before using new packages

[workspace.dependencies]
python = ">=3.12,<3.16"

# Core numerical packages
scipy = ">=1.18.1,<2"
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
xarray = ">=2026.7.0,<2027"
finufft = ">=2.5.1,<3"

# Graphical user interface
pyside6 = ">=6.11.2,<7"
pyqtgraph = ">=0.14.0,<0.15"

# Plot formatting
colorcet = ">=3.2.1,<4"

# File IO
pyyaml = ">=6.0.3,<7"  # Load theoretical aperture files
netcdf4 = ">=1.7.4,<2" # Export xarray to HDF5 (reports exporting)
h5py = ">=3.16.0,<4"   # Read HDF5 files for LEmmA formatted measurement loader
pandas = ">=3.0.6,<4"  # Gain calibration file loader

# Unit handling/formatting
quantiphy = ">=2.23,<3"
unyt = ">=3.1.0,<4"

[package]
name = "xnft"
version = "0.0.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[package.build-dependencies]
git = ">=2.53.0,<3"

[package.host-dependencies]
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"

[package.run-dependencies]
python = { workspace = true }
scipy = { workspace = true }
numpy = { workspace = true }
numba = { workspace = true }
xarray = { workspace = true }
finufft = { workspace = true }
pyside6 = { workspace = true }
pyqtgraph = { workspace = true }
colorcet = { workspace = true }
pyyaml = { workspace = true }
netcdf4 = { workspace = true }
h5py = { workspace = true }
pandas = { workspace = true }
quantiphy = { workspace = true }
unyt = { workspace = true }

[package.build.config]
noarch = true

[activation.env]
# Workaround to enforce editable installation -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
# BUILD_EDITABLE_PYTHON = "true"

[environments]
jupyter = ["dev", "test", "jupyter"]
build = ["build"]
test = ["test"]
dev = ["test", "docs", "dev"]

# Python version testing environments
test-py312 = ["test", "py312"]
test-py313 = ["test", "py313"]
test-py314 = ["test", "py314"]

[environments.docs]
features = ["docs"]

[environments.docs.dependencies]
myst-parser = ">=5.1.0,<6"

[tasks]

[feature.test.tasks]

test = "pytest -s"

[feature.docs.tasks]

build-apidoc = { cmd = [
  "rm",
  "-rf",
  "docs/api/source/api",
  "&&",
  "sphinx-apidoc",
  "-o",
  "docs/api/source/api",
  "src/xnft",
] }

build-html-docs = { cmd = [
  "echo",
  "'Building HTML docs...'",
  "&&",
  "sphinx-build",
  "-M",
  "html",
  "$PIXI_PROJECT_ROOT/docs/api/source",
  "$PIXI_PROJECT_ROOT/docs/api/build",
], depends-on = [
  "build-apidoc",
] }

build-pdf-docs = { cmd = [
  "echo",
  "'Building LaTeX PDF docs...'",
  "&&",
  "sphinx-build",
  "-M",
  "latexpdf",
  "$PIXI_PROJECT_ROOT/docs/api/source",
  "$PIXI_PROJECT_ROOT/docs/api/build",
  "&&",
  "mv",
  "$PIXI_PROJECT_ROOT/docs/api/build/latex/*.pdf",
  "$PIXI_PROJECT_ROOT/docs/api/build",
], depends-on = [
  "build-apidoc",
] }

build-docs = { depends-on = ["build-html-docs", "build-pdf-docs"] }

[feature.dev.tasks]
format = { cmd = ["black", "$PIXI_PROJECT_ROOT", "--line-length", "79"] }

[feature.build.tasks.gen-icons]
cmd = [
  "bash",
  "-c",
  """
set -e

PNG_PATH="src/xnft/resources/icons/xnft.png"
ICO_PATH="src/xnft/resources/icons/xnft.ico"
ICNS_PATH="src/xnft/resources/icons/xnft.iconset"

# Windows
magick "${PNG_PATH}" -define icon:auto-resize=16,32,48,256 "${ICO_PATH}"

# macOS
mkdir -p "${ICNS_PATH}"

sizes="16:32 32:64 128:256 256:512 512:1024"
for pair in ${sizes}; do
  base=${pair%:*}
  retina=${pair#*:}

  magick "${PNG_PATH}" -resize ${base}x${base} "${ICNS_PATH}/icon_${base}x${base}.png"
  magick "${PNG_PATH}" -resize ${retina}x${retina} "${ICNS_PATH}/icon_${base}x${base}@2x.png"
done

iconutil -c icns "${ICNS_PATH}"
""",
]

[feature.build.tasks.build-exe]
cmd = ["pyinstaller", "--noconfirm", "xnft.spec"]

[feature.build.tasks.build-wheel]
cmd = ["uv", "build"]

[feature.build.tasks.release]
args = [{ arg = "platform", default = "osx-arm64" }]
cmd = [
  "bash",
  "-c",
  """
set -euo pipefail

VERSION="$(git describe --tags --abbrev=0)"
VERSION_PEP440="${VERSION#v}"   # remove leading 'v' from tag

TOKEN="$(security find-generic-password -s gitlab-token -w)"

PROJECT_ID=28094
PACKAGE_NAME=xnft
FILE="xnft-{{ platform }}-${VERSION_PEP440}.zip"
FILE_PATH="dist/${FILE}"
URL="https://gitlab.msu.edu/api/v4/projects/${PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${FILE}"

curl --fail --show-error --silent \
  --header "PRIVATE-TOKEN: ${TOKEN}" \
  --upload-file "${FILE_PATH}" \
  "${URL}"

curl --fail --show-error --silent \
  --request POST \
  --header "PRIVATE-TOKEN: ${TOKEN}" \
  --data "name={{ platform }}" \
  --data "url=${URL}" \
  "https://gitlab.msu.edu/api/v4/projects/${PROJECT_ID}/releases/${VERSION}/assets/links"
""",
]

[dependencies]
# Editable installation not yet supported -- see:
# https://pixi.prefix.dev/dev/build/backends/pixi-build-python/#editable-installations
xnft = { path = "." }
git-lfs = ">=3.8.0,<4"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
types-pyyaml = ">=6.0.12.20260906,<7"
ruff = ">=0.16.10,<0.17"
pytest-qt = ">=4.5.0,<5"

[feature.test.target.osx.dependencies]
pytest-memray = ">=1.9.0,<2"

[feature.test.target.linux.dependencies]
pytest-memray = ">=1.9.0,<2"

[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
pydata-sphinx-theme = ">=0.22.0,<0.23"
numpydoc = ">=1.11.0,<2"
sphinx-copybutton = ">=0.5.2,<0.6"
make = ">=4.4.1,<5"
perl = ">=5.44.0,<5.45"

[feature.docs.target.linux.dependencies]
texlive-core = ">=20260301,<20260302"

[feature.docs.target.osx.dependencies]
texlive-core = ">=20260301,<20260302"

[feature.dev.dependencies]
ty = ">=0.0.84,<0.0.85"
flake8 = ">=7.4.1,<8"
pyflakes = ">=4.0.1,<5"
black = ">=26.5.1,<27"
scipy-stubs = ">=1.18.1.1,<2"
pandas-stubs = ">=3.0.5.260914,<4"
pre-commit = ">=4.6.2,<5"

[feature.dev.target.osx.dependencies]
memray = ">=1.19.3,<2"

[feature.dev.target.linux.dependencies]
memray = ">=1.19.3,<2"

[feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.10.0,<0.11"
tqdm = ">=4.70.1,<5"
numba-progress = ">=1.1.0,<2"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"

[feature.build.dependencies]
pyinstaller = ">=6.22.3,<7"
pillow = ">=12.3.0,<13"
uv = ">=0.12.21,<0.13"
glab = ">=1.120.0,<2"
imagemagick = ">=7.1.2_31,<8"
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"

[feature.py312.dependencies]
python = "3.12.*"
"backports.zstd" = ">=1.7,<2"

[feature.py313.dependencies]
python = "3.13.*"
"backports.zstd" = ">=1.7,<2"

[feature.py314.dependencies]
python = "3.14.*"
