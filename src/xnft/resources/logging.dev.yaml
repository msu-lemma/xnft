version: 1
disable_existing_loggers: false
formatters:
  dev:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: dev
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]

# Set log level of submodules
loggers:
  xnft.loaders:
    level: DEBUG
  xnft.core:
    level: INFO